<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>실시간 드래그 앤 드랍 리스트</title>
    <style>
        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            touch-action: none; /* 모바일 브라우저의 당겨서 새로고침 등 기본 스와이프 방지 */
        }
        .container {
            background-color: #1e1e1e; /* 옵시디언 다크 배경 */
            padding: 0;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }
        h2 {
            text-align: center;
            color: #e0e0e0;
            z-index: 10;
        }
        .draggable-list {
            padding: 0;
            margin: 0;
            position: relative;
            flex: 1;
            width: 100%;
            overflow: visible;
            perspective: 1000px;
            cursor: grab;
            touch-action: none; /* 터치 제스처 온전히 캔버스에서 소비 */
        }
        .draggable-list.panning {
            cursor: grabbing;
        }
        .draggable-list.panning * {
            cursor: grabbing !important;
        }
        /* 줌(Zoom) 처리를 위한 레이어 */
        .zoom-layer {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            transform-origin: center center;
            transition: transform 0.1s ease-out;
        }
        .draggable-item {
            position: absolute;
            left: 50%;
            top: 50%;
            padding-left: 15px; /* 점(Dot)을 위한 여백 */
            background: none;
            border: none;
            color: #a0a0a0;
            font-size: 0.9rem;
            font-weight: 400;
            white-space: nowrap;
            cursor: pointer;
            transition: opacity 0.3s, color 0.2s;
            user-select: none;
            list-style: none;
            touch-action: none; /* Prevents scrolling while dragging */
            opacity: var(--relevance, 1);
            z-index: 10;
            transform-origin: 5px 50%; /* 스케일 확대 시 점(Dot)의 중심을 축으로 고정하여 어긋남 방지 */
        }
        .draggable-item::before {
            content: '';
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: #4db6ac; /* 청록색으로 통일 */
            box-shadow: 0 0 8px rgba(77, 182, 172, 0.4);
            transition: transform 0.2s, background-color 0.2s;
        }
        /* 서브 항목 스타일 */
        .draggable-item.sub-item {
            padding-left: 12px;
            font-size: 0.8rem;
            color: #777;
        }
        .draggable-item.sub-item::before {
            width: 10px;
            height: 10px;
            background-color: #4db6ac;
            box-shadow: none;
            opacity: 0.6;
        }
        .draggable-item.dragging {
            opacity: 0.9;
            color: #fff;
            z-index: 100;
            transition: none !important; /* 드래그 시 반응성을 위해 트랜지션 제거 */
            cursor: grabbing;
        }
        .draggable-item:hover:not(.dragging) {
            color: #fff;
            transform: translate(calc(var(--tx) - 5px), calc(var(--ty) - 50%)) scale(1.05) !important;
            opacity: 1 !important;
        }
        .draggable-item.sub-item:hover:not(.dragging) {
            transform: translate(calc(var(--tx) - 5px), calc(var(--ty) - 50%)) scale(1.05) !important;
        }
        .draggable-item:hover:not(.dragging)::before {
            transform: translateY(-50%) scale(1.4);
            background-color: #fff;
        }

        /* 인라인 텍스트 편집 모드 스타일 */
        .draggable-item .node-text[contenteditable="true"] {
            cursor: text;
            outline: 1px dashed #4db6ac;
            background: rgba(0, 0, 0, 0.4);
            padding: 2px 6px;
            border-radius: 4px;
            user-select: text;
            -webkit-user-select: text;
            display: inline-block;
        }
        
        /* 노드별 개별 조작 버튼 스타일 */
        .node-actions {
            position: absolute;
            left: 100%;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            gap: 5px;
            padding-left: 8px; /* 텍스트 바로 옆에 표시되도록 패딩 축소 */
            opacity: 0;
            transition: opacity 0.2s;
            pointer-events: none;
        }
        .draggable-item:hover .node-actions {
            opacity: 1;
            pointer-events: auto;
        }
        .action-btn {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            border: none;
            background: #333;
            color: #ccc;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            transition: background 0.2s, color 0.2s, transform 0.1s;
        }
        .action-btn:hover { transform: scale(1.1); }
        .action-btn.add-btn:hover { background: #4db6ac; color: #fff; }
        .action-btn.del-btn:hover { background: #ff4a4a; color: #fff; }

        .lines-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 5;
        }
        line {
            stroke: #555;
            stroke-opacity: 0.6;
        }
        .draggable-list.collapsed .draggable-item {
            opacity: 0;
            transform: translate(0, 0) scale(0) !important;
            pointer-events: none;
        }

        /* 하이라이트 효과 (포커스 모드) */
        .draggable-list.has-highlight .draggable-item:not(.highlighted),
        .draggable-list.has-highlight .center-node:not(.highlighted) {
            opacity: 0.15 !important;
        }
        .draggable-list.has-highlight line:not(.highlighted) {
            stroke-opacity: 0.05 !important;
        }
        .draggable-item.highlighted,
        .center-node.highlighted {
            opacity: 1 !important;
            z-index: 100;
        }
        line.highlighted {
            stroke-opacity: 0.9 !important;
            stroke-width: 2.5px !important;
            stroke: #4db6ac !important;
        }

        /* 중앙 장식 요소 */
        .center-node {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-10px, -50%);
            padding-left: 28px; /* 20px dot + 8px gap */
            color: #ddd;
            font-weight: bold;
            font-size: 1rem;
            white-space: nowrap;
            cursor: pointer;
            transition: transform 0.2s, color 0.2s, opacity 0.3s;
            user-select: none;
            z-index: 20;
            transform-origin: 10px 50%;
        }
        .center-node::before {
            content: '';
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background-color: #4db6ac;
            box-shadow: 0 0 15px rgba(77, 182, 172, 0.5);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .center-node:hover {
            transform: translate(-10px, -50%) scale(1.05);
            color: #fff;
        }
        .center-node:hover::before {
            transform: translateY(-50%) scale(1.2);
            box-shadow: 0 0 20px rgba(77, 182, 172, 0.8);
        }
        /* 파티클 효과 스타일 */
        .particle {
            position: fixed;
            pointer-events: none;
            border-radius: 50%;
            z-index: 1000;
            mix-blend-mode: multiply;
        }
        
        /* AI 분석 툴팁 스타일 */
        .ai-tooltip {
            position: fixed;
            background: rgba(30, 30, 30, 0.95);
            color: #ddd;
            border: 1px solid #555;
            padding: 15px;
            border-radius: 8px;
            font-size: 0.85rem;
            max-width: 280px;
            line-height: 1.5;
            box-shadow: 0 8px 24px rgba(0,0,0,0.6);
            pointer-events: none; /* 마우스 간섭 방지 */
            z-index: 2000;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.2s, visibility 0.2s;
        }
        .ai-tooltip.visible {
            opacity: 1;
            visibility: visible;
        }
        .ai-tooltip strong {
            color: #4db6ac;
            font-size: 0.95rem;
            margin-bottom: 8px;
            display: inline-block;
        }

        /* 노드 추가 버튼 다크 테마 */
        #topicInput {
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid #555;
            background: #2a2a2a;
            color: #eee;
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.2s;
        }
        #topicInput:focus {
            border-color: #4db6ac;
        }
        #generateBtn,
        #addNodeBtn {
            background: #333;
            color: #ccc;
            border: 1px solid #555;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }
        #generateBtn:hover,
        #addNodeBtn:hover {
            background: #555;
            color: #fff;
        }
        #addNodeBtn {
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>마이 루틴</h2>
    <div class="search-box-container">
        <input type="text" id="topicInput" placeholder="주제어를 입력하세요..." autocomplete="off">
        <button id="generateBtn" title="주제어 기반 자동 생성">자동 생성</button>
        <button id="addNodeBtn" title="새 노드 추가">+</button>
    </div>
    <ul class="draggable-list">
        <div class="zoom-layer">
            <div class="center-node">START</div>
            <svg class="lines-container">
            </svg>

            <!-- 반도체 산업군 -->
            <li class="draggable-item" data-id="s1"><span class="node-text">전공정</span></li>
            <li class="draggable-item sub-item" data-id="s1-1" data-parent="s1"><span class="node-text">웨이퍼</span></li>
            <li class="draggable-item sub-item" data-id="s1-2" data-parent="s1"><span class="node-text">식각</span></li>
            <li class="draggable-item" data-id="s2"><span class="node-text">설계</span></li>
            <li class="draggable-item sub-item" data-id="s2-1" data-parent="s2"><span class="node-text">회로</span></li>
            <li class="draggable-item" data-id="s3"><span class="node-text">후공정</span></li>
            <li class="draggable-item sub-item" data-id="s3-1" data-parent="s3"><span class="node-text">테스트</span></li>
        </div>
    </ul>
    <div id="aiTooltip" class="ai-tooltip"></div>
</div>

<script>
    const list = document.querySelector('.draggable-list');
    const zoomLayer = document.querySelector('.zoom-layer');
    const svg = document.querySelector('.lines-container');
    const centerNode = document.querySelector('.center-node');
    let isExpanded = true;
    
    // 라이선스 충돌을 방지하는 독자적인 드래그 상태 관리 객체
    const dragState = {
        target: null,       // 현재 드래그 중인 노드 데이터
        startX: 0, startY: 0, // 마우스 클릭 시작 좌표
        isMoving: false,    // 이동 여부 (클릭 vs 드래그 구분)
        currentX: 0, currentY: 0 // 물리 엔진에 전달할 마우스 실시간 좌표
    };

    let zoomScale = 1;
    let panX = 0, panY = 0; // 화면 이동(Pan) 위치 저장
    let isPanning = false;
    let panStartPos = { x: 0, y: 0 };
    let initialPanPos = { x: 0, y: 0 };
    let itemsData = []; // { el, id, parentId, tx, ty, vx, vy }
    let currentTopic = 'START'; // 현재 중앙 노드의 주제어 저장
    
    // 멀티 터치(핀치 줌) 관리를 위한 포인터 캐시
    const activePointers = new Map();
    let initialPinchDist = 0;
    let initialZoomScale = 1;
    
    const aiTooltip = document.getElementById('aiTooltip');
    let tooltipTimeout;
    const aiCache = {};

    function updateTransform() {
        zoomLayer.style.transform = `translate(${panX}px, ${panY}px) scale(${zoomScale})`;
    }

    function saveToLocalStorage() {
        const data = itemsData.map(it => ({
            id: it.id,
            parentId: it.parentId,
            text: it.el.querySelector('.node-text').textContent,
            relevance: it.relevance
        }));
        localStorage.setItem('mindmap_nodes', JSON.stringify(data));
        localStorage.setItem('mindmap_topic', currentTopic);
    }

    function init() {
        const savedData = localStorage.getItem('mindmap_nodes');
        const savedTopic = localStorage.getItem('mindmap_topic');
        
        if (savedTopic) {
            currentTopic = savedTopic;
            centerNode.textContent = currentTopic;
        }

        if (savedData) {
            const data = JSON.parse(savedData);
            // 기존 하드코딩된 노드 제거
            list.querySelectorAll('.draggable-item').forEach(el => el.remove());
            itemsData = [];
            // 저장된 데이터로 노드 복구
            data.forEach(node => addNewNode(node.text, node.parentId, node.id, false, null, null, node.relevance));
        } else {
            const itemNodes = list.querySelectorAll('.draggable-item');
            itemsData = Array.from(itemNodes).map(el => ({
                el,
                id: el.dataset.id,
                parentId: el.dataset.parent || null,
                // 폭발하듯 흩어지도록 초기 위치를 무작위로 미세하게 부여
                tx: (Math.random() - 0.5) * 50,
                ty: (Math.random() - 0.5) * 50,
                vx: 0,
                vy: 0,
                relevance: 1.0
            }));

            itemsData.forEach((item) => {
                item.el.style.setProperty('--relevance', item.relevance);
                attachNodeActions(item.el, item.id);
                makeNodeEditable(item.el);
                item.el.addEventListener('pointerdown', onPointerDown);
                item.el.addEventListener('contextmenu', onContextMenu);
                item.el.addEventListener('pointerenter', onNodeEnter);
                item.el.addEventListener('pointerleave', onNodeLeave);
                const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                svg.appendChild(line);
            });
            saveToLocalStorage();
        }

        // 글로벌 포인터 관리 (멀티 터치 추적용)
        window.addEventListener('pointerdown', (e) => {
            activePointers.set(e.pointerId, e);
            
            if (activePointers.size === 2) {
                isPanning = false; // 핀치 줌 시작 시 패닝 취소
                list.classList.remove('panning');
                if (dragState.target) {
                    dragState.target.el.classList.remove('dragging');
                    dragState.target = null;
                }
                const pts = Array.from(activePointers.values());
                initialPinchDist = Math.hypot(pts[0].clientX - pts[1].clientX, pts[0].clientY - pts[1].clientY);
                initialZoomScale = zoomScale;
                zoomLayer.style.transition = 'none';
            }
        }, { capture: true }); // 가장 먼저 이벤트를 수집하기 위해 capture 사용

        window.addEventListener('pointermove', onPointerMove);
        window.addEventListener('pointerup', onPointerUp);
        window.addEventListener('pointercancel', onPointerUp); // 터치 영역 벗어남 대비

        centerNode.addEventListener('pointerenter', onNodeEnter);
        centerNode.addEventListener('pointerleave', onNodeLeave);

        // 휠 줌(Zoom) 이벤트 리스너 추가
        // Ctrl 키를 누른 상태에서 스크롤할 때만 줌 작동
        list.addEventListener('wheel', (e) => {
            if (e.ctrlKey) {
                e.preventDefault();
                const delta = e.deltaY > 0 ? 0.9 : 1.1;
                zoomScale = Math.min(Math.max(0.3, zoomScale * delta), 3);
                updateTransform();
            }
        }, { passive: false });

        // 바탕 화면 드래그로 패닝(Panning) 이벤트 리스너 추가
        list.addEventListener('pointerdown', (e) => {
            // 마우스 좌클릭이고, 타겟이 노드나 검색 컨테이너가 아닐 때만 작동
            const isNode = e.target.closest('.draggable-item') || e.target.closest('.center-node') || e.target.closest('.search-box-container');
            if (!isNode && e.button === 0 && activePointers.size <= 1) {
                isPanning = true;
                panStartPos = { x: e.clientX, y: e.clientY };
                initialPanPos = { x: panX, y: panY };
                zoomLayer.style.transition = 'none';
                list.classList.add('panning');
                list.setPointerCapture(e.pointerId);
            }
        });

        // 노드 추가 버튼 이벤트 리스너
        document.getElementById('addNodeBtn').addEventListener('click', () => {
            const text = window.prompt("새 공정 이름을 입력하세요:", "새 공정");
            if (text) {
                addNewNode(text);
            }
        });

        // 주제어 자동 생성 기능
        const topicInput = document.getElementById('topicInput');
        const generateBtn = document.getElementById('generateBtn');

        const handleGenerate = () => {
            const topic = topicInput.value.trim();
            if (topic) {
                autoGenerateNodes(topic);
                topicInput.value = '';
            } else {
                alert('주제어를 입력해주세요.');
            }
        };

        generateBtn.addEventListener('click', handleGenerate);
        topicInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleGenerate();
        });

        animate();
    }

    // AI 기반 주제어 자동 생성 로직
    async function autoGenerateNodes(topic) {
        currentTopic = topic;
        centerNode.textContent = currentTopic;
        localStorage.setItem('mindmap_topic', currentTopic);

        const oldNodes = Array.from(list.querySelectorAll('.draggable-item'));
        const oldLines = Array.from(svg.querySelectorAll('line'));
        const centerX = list.offsetWidth / 2;
        const centerY = list.offsetHeight / 2;

        // 선 퇴장 애니메이션 (빠르게 투명해지며 사라짐)
        oldLines.forEach(line => {
            const anim = line.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 200, fill: 'forwards' });
            anim.onfinish = () => line.remove();
        });

        // 노드 퇴장 애니메이션 (화면 밖으로 흩어지며 날아감)
        oldNodes.forEach(node => {
            const tx = parseFloat(node.style.getPropertyValue('--tx')) || centerX;
            const ty = parseFloat(node.style.getPropertyValue('--ty')) || centerY;
            const dotOffset = node.classList.contains('sub-item') ? 3 : 5;
            
            // 화면 중앙으로부터 뻗어나가는 척력(방향 벡터) 계산
            let dx = tx - centerX;
            let dy = ty - centerY;
            if (dx === 0 && dy === 0) { dx = (Math.random() - 0.5); dy = (Math.random() - 0.5); }
            const dist = Math.sqrt(dx * dx + dy * dy);
            
            // 화면 밖으로 날아가도록 충분히 먼 목적지 좌표 설정
            const flyDist = Math.max(window.innerWidth, window.innerHeight); 
            const destX = tx + (dx / dist) * flyDist;
            const destY = ty + (dy / dist) * flyDist;

            const anim = node.animate([
                { transform: `translate(calc(${tx}px - ${dotOffset}px), calc(${ty}px - 50%)) scale(1)`, opacity: 1 },
                { transform: `translate(calc(${destX}px - ${dotOffset}px), calc(${destY}px - 50%)) scale(0)`, opacity: 0 }
            ], {
                duration: 500 + Math.random() * 200, // 파편처럼 약간씩 다른 속도로 퇴장
                easing: 'ease-in', // 가속도가 붙으며 날아감
                fill: 'forwards'
            });

            anim.onfinish = () => node.remove();
        });

        itemsData = [];
        draggingItem = null;

        // AI 연관 서브 노드 자동 생성 (중앙 노드에 직접 연결되도록 parentId를 null로 설정)
        const subTopics = await generateAISections(topic);
        subTopics.forEach((sub, index) => {
            // 기존 CSS에서 지정된 옵시디언 테마 색상이 입혀지도록 s1, s2, s3 등의 ID 접두사 부여
            const fakeGroupId = 's' + ((index % 3) + 1) + '-' + Date.now() + index;
            addNewNode(sub, null, fakeGroupId, index === subTopics.length - 1);
        });
    }

    function makeNodeEditable(li) {
        const textSpan = li.querySelector('.node-text');
        if (!textSpan) return;

        textSpan.addEventListener('dblclick', (e) => {
            e.stopPropagation(); // 부모 이벤트 간섭 방지
            
            textSpan.contentEditable = "true";
            textSpan.focus();
            
            // 편집 중 AI 툴팁 숨기기
            aiTooltip.classList.remove('visible');
            clearTimeout(tooltipTimeout);

            // 커서를 텍스트 끝으로 이동
            const selection = window.getSelection();
            const range = document.createRange();
            range.selectNodeContents(textSpan);
            range.collapse(false);
            selection.removeAllRanges();
            selection.addRange(range);
        });

        const finishEditing = () => {
            if (textSpan.contentEditable === 'true') {
                textSpan.contentEditable = "false";
                saveToLocalStorage(); // 수정 완료 시 저장
            }
        };

        textSpan.addEventListener('blur', finishEditing);
        textSpan.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault(); // 줄바꿈 방지
                textSpan.blur(); // 포커스 해제로 편집 종료
            }
        });
    }

    function attachNodeActions(li, id) {
        const actions = document.createElement('div');
        actions.className = 'node-actions';

        // 개별 하위 노드 추가 버튼
        const addBtn = document.createElement('button');
        addBtn.className = 'action-btn add-btn';
        addBtn.innerHTML = '＋';
        addBtn.title = '하위 노드 추가';
        addBtn.addEventListener('pointerdown', e => e.stopPropagation()); // 드래그 간섭 방지
        addBtn.addEventListener('click', e => {
            e.stopPropagation();
            const text = window.prompt("새 하위 노드 이름을 입력하세요:", "새 노드");
            if (text) {
                const parentItem = itemsData.find(it => it.id === id);
                if (parentItem) {
                    const newId = 'node-' + Date.now() + Math.random().toString(36).substr(2, 5);
                    addNewNode(text, id, newId, true, parentItem.tx, parentItem.ty);
                }
            }
        });

        // 개별 노드 삭제 버튼
        const delBtn = document.createElement('button');
        delBtn.className = 'action-btn del-btn';
        delBtn.innerHTML = '×';
        delBtn.title = '노드 삭제';
        delBtn.addEventListener('pointerdown', e => e.stopPropagation());
        delBtn.addEventListener('click', e => {
            e.stopPropagation();
            const topic = li.querySelector('.node-text').textContent.trim();
            if (window.confirm(`'${topic}' 노드와 연결된 하위 노드들을 삭제하시겠습니까?`)) {
                deleteNode(id);
                aiTooltip.classList.remove('visible');
            }
        });

        actions.appendChild(addBtn);
        actions.appendChild(delBtn);
        li.appendChild(actions);
    }

    function addNewNode(text, parentId = null, id = null, shouldSave = true, spawnX = null, spawnY = null, savedRelevance = null) {
        const li = document.createElement('li');
        li.className = 'draggable-item' + (parentId ? ' sub-item' : '');
        li.innerHTML = `<span class="node-text">${text}</span>`;
        const newId = id || 'node-' + Date.now() + Math.random().toString(36).substr(2, 5);
        li.dataset.id = newId;
        if (parentId) li.dataset.parent = parentId;
        
        zoomLayer.appendChild(li);
        
        const newItem = {
            el: li,
            id: newId,
            parentId: parentId,
            tx: (Math.random() - 0.5) * 50,
            ty: (Math.random() - 0.5) * 50,
            vx: 0,
            vy: 0
        };
        
        itemsData.push(newItem);
        attachNodeActions(li, newId);
        makeNodeEditable(li);
        li.addEventListener('pointerdown', onPointerDown);
        li.addEventListener('contextmenu', onContextMenu);
        li.addEventListener('pointerenter', onNodeEnter);
        li.addEventListener('pointerleave', onNodeLeave);
        
        const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
        svg.appendChild(line);

        if (shouldSave) saveToLocalStorage();
    }

    // 가상의 연관성 분석 로직 (실제로는 NLP/LLM API 연동 권장)
    function analyzeRelevance(parentText, childText) {
        let score = 0.3; // 기본 최소 연관성 점수
        
        // 공통 문자 포함 여부로 간단히 점수 가산
        const parentChars = new Set(parentText.replace(/\s/g, '').split(''));
        let matchCount = 0;
        for (let char of childText.replace(/\s/g, '')) {
            if (parentChars.has(char)) matchCount++;
        }
        
        if (matchCount > 0) score += 0.4;
        score += Math.random() * 0.3; // 무작위성(의외성) 부여
        
        return Math.min(score, 1.0);
    }

    // 가상 AI 목차/세부 속성 생성 API
    async function generateAISections(topic) {
        return new Promise(resolve => {
            setTimeout(() => {
                // 키워드에 어울리는 하위 토픽을 AI가 분류한 것처럼 반환
                resolve([
                    `${topic} 핵심 원리`,
                    `${topic} 주요 동향`,
                    `${topic} 활용 사례`,
                    `${topic} 향후 전망`
                ]);
            }, 700 + Math.random() * 400); // AI 추론(Latency) 시뮬레이션
        });
    }

    async function toggleNodeExpansion(parentItem, topic) {
        const existingChildren = itemsData.filter(it => it.parentId === parentItem.id);
        if (existingChildren.length > 0) {
            // 이미 하위 노드가 있다면 모두 삭제 (토글 닫기)
            existingChildren.forEach(child => deleteNode(child.id));
            return;
        }

        parentItem.el.style.opacity = '0.5'; // 로딩 중 시각적 피드백
        let subTopics = await generateAISections(topic);
        parentItem.el.style.opacity = ''; // 복구

        // 대기하는 동안 부모가 삭제되었거나 이미 확장되었는지 방어 코드
        if (!itemsData.find(it => it.id === parentItem.id)) return;
        if (itemsData.filter(it => it.parentId === parentItem.id).length > 0) return;

        if (subTopics.length === 0) {
            subTopics = [`${topic} 분석 불가`];
        }

        const match = parentItem.id.match(/^s\d/);
        const prefix = match ? match[0] : 's' + (Math.floor(Math.random() * 3) + 1);

        subTopics.forEach((sub, index) => {
            const childId = prefix + '-' + Date.now() + '-' + index;
            // 부모의 현재 위치(tx, ty)에서 생성되어 자연스럽게 뻗어나가도록 설정
            addNewNode(sub, parentItem.id, childId, index === subTopics.length - 1, parentItem.tx, parentItem.ty);
        });
    }

    // --- 자체 물리 엔진 알고리즘 ---
    function updatePhysics() {
        const repulsion = 3000; // 서로 밀어내는 힘 (원형 유지를 위해 전체적으로 상향)
        const springK = 0.04;   // 연결된 노드끼리 당기는 탄성 계수 (조금 더 부드럽게)
        const rootRestingLength = 180; // START 노드와의 적정 거리 (방사형 확장을 위해 상향)
        const childRestingLength = 110; // 부모-자식 간의 적정 거리 (상향)
        const damping = 0.7;    // 마찰력 (속도 감쇠)
        const collisionRadius = 70; // 노드 겹침을 방지하는 물리 충돌 반경
        const collisionStrength = 0.8; // 겹쳤을 때 미끄러지듯 밀어내는 탄성 강도

        if (!isExpanded) {
            // 닫혔을 때는 중앙으로 끌어당김
            itemsData.forEach(item => {
                item.tx += (0 - item.tx) * 0.2;
                item.ty += (0 - item.ty) * 0.2;
            });
            return;
        }

        // 1. 척력 (Repulsion - 쿨롱의 법칙)
        for (let i = 0; i < itemsData.length; i++) {
            // 중앙 START 노드(0,0)가 밀어내는 힘
            let tx = itemsData[i].tx;
            let ty = itemsData[i].ty;
            if (tx === 0 && ty === 0) { tx = (Math.random() - 0.5) * 5; ty = (Math.random() - 0.5) * 5; } // 좌표 겹침 방지
            
            // 텍스트 길이 왜곡 제거: 순수 원형(방사형) 척력으로 복구
            let dSq = tx * tx + ty * ty;
            let d = Math.sqrt(dSq);
            if (d < 30) { d = 30; dSq = 900; } // 최소 거리 캡 증가

            let force = (repulsion * 2) / dSq;
            
            // 중앙 노드(START)와의 하드 충돌 처리
            if (d < collisionRadius) {
                force += (collisionRadius - d) * collisionStrength;
            }
            itemsData[i].vx += (tx / d) * force;
            itemsData[i].vy += (ty / d) * force;

            for (let j = i + 1; j < itemsData.length; j++) {
                let dx = itemsData[i].tx - itemsData[j].tx;
                let dy = itemsData[i].ty - itemsData[j].ty;
                if (dx === 0 && dy === 0) { dx = (Math.random() - 0.5) * 5; dy = (Math.random() - 0.5) * 5; }
                
                let distSq = dx * dx + dy * dy;
                let dist = Math.sqrt(distSq);
                if (dist < 30) { dist = 30; distSq = 900; }
                
                let repForce = repulsion / distSq;
                let fx = (dx / dist) * repForce;
                let fy = (dy / dist) * repForce;

                // 노드 간 하드 충돌(Collision) 처리: 겹치면 자연스럽게 미끄러지며 튕겨나감
                if (dist < collisionRadius) {
                    let overlap = collisionRadius - dist;
                    // 드래그 중인 노드가 밀고 들어올 때는 더 강하게 비켜주도록 설정
                    let isDragCollision = (itemsData[i] === dragState.target || itemsData[j] === dragState.target);
                    let pushForce = overlap * collisionStrength * (isDragCollision ? 1.5 : 1);
                    fx += (dx / dist) * pushForce;
                    fy += (dy / dist) * pushForce;
                }

                itemsData[i].vx += fx;
                itemsData[i].vy += fy;
                itemsData[j].vx -= fx;
                itemsData[j].vy -= fy;
            }
        }

        // 2. 인력 (Attraction - 훅의 법칙)
        itemsData.forEach(item => {
            let targetX = 0, targetY = 0, targetDist = rootRestingLength;
            
            if (item.parentId) {
                const parent = itemsData.find(p => p.id === item.parentId);
                if (parent) {
                    targetX = parent.tx;
                    targetY = parent.ty;
                    targetDist = childRestingLength;
                }
            }

            let dx = targetX - item.tx;
            let dy = targetY - item.ty;
            let dist = Math.sqrt(dx * dx + dy * dy);
            if (dist === 0) { dx = 0.1; dist = 0.1; }
            let springForce = (dist - targetDist) * springK;

            let fx = (dx / dist) * springForce;
            let fy = (dy / dist) * springForce;

            item.vx += fx;
            item.vy += fy;
            
            // 화면 밖으로 날아가지 않도록 약한 중앙 인력 추가
            item.vx += (0 - item.tx) * 0.005;
            item.vy += (0 - item.ty) * 0.005;
        });

        // 3. 속도 업데이트 및 마찰력 적용 (Integrate)
        itemsData.forEach(item => {
            if (item === dragState.target) {
                item.vx = 0;
                item.vy = 0;
                item.tx = dragState.currentX;
                item.ty = dragState.currentY;
            } else {
                item.vx *= damping;
                item.vy *= damping;
                item.tx += item.vx;
                item.ty += item.vy;
            }
        });
    }

    function getDescendantIds(id) {
        let ids = [id];
        itemsData.filter(it => it.parentId === id).forEach(child => {
            ids = ids.concat(getDescendantIds(child.id));
        });
        return ids;
    }

    function deleteNode(id) {
        const idsToDelete = getDescendantIds(id);
        const lines = svg.querySelectorAll('line');
        
        // 역순으로 삭제해야 인덱스 꼬임 현상을 방지하고 SVG 라인과 정확히 매칭됩니다.
        for (let i = itemsData.length - 1; i >= 0; i--) {
            if (idsToDelete.includes(itemsData[i].id)) {
                if (dragState.target === itemsData[i]) {
                    dragState.target = null;
                    dragState.isMoving = false;
                }
                itemsData[i].el.remove();
                if (lines[i]) lines[i].remove();
                itemsData.splice(i, 1);
            }
        }
        
        saveToLocalStorage();
    }

    function animate() {
        updatePhysics();
        arrangeItems();
        requestAnimationFrame(animate);
    }

    function createParticle(x, y) {
        const p = document.createElement('div');
        p.classList.add('particle');
        const size = Math.random() * 6 + 3; // 3px ~ 9px 크기
        p.style.width = `${size}px`;
        p.style.height = `${size}px`;

        // 테마에 맞는 색상 랜덤 적용
        const colors = ['#a882ff', '#4db6ac', '#ffd54f', '#ba68c8', '#ffffff'];
        p.style.background = colors[Math.floor(Math.random() * colors.length)];
        
        p.style.left = `${x - size / 2}px`;
        p.style.top = `${y - size / 2}px`;
        
        document.body.appendChild(p);
        
        const angle = Math.random() * Math.PI * 2;
        const velocity = Math.random() * 40 + 20; // 20 ~ 60px 이동
        const destX = Math.cos(angle) * velocity;
        const destY = Math.sin(angle) * velocity;
        
        const animation = p.animate([
            { transform: 'translate(0, 0) scale(1)', opacity: 0.8 },
            { transform: `translate(${destX}px, ${destY}px) scale(0)`, opacity: 0 }
        ], { duration: 500 + Math.random() * 300, easing: 'ease-out' });
        
        animation.onfinish = () => p.remove();
    }

    function onContextMenu(e) {
        e.preventDefault(); // 기본 우클릭 브라우저 메뉴 띄우기 방지
        const el = e.currentTarget;
        const item = itemsData.find(it => it.el === el);
        if (!item) return;

        const topic = item.el.querySelector('.node-text').textContent.trim();
        if (window.confirm(`'${topic}' 공정과 그 하위 공정들을 삭제하시겠습니까?`)) {
            deleteNode(item.id);
        }
    }

    // 가상 AI 요약 분석 API
    async function generateAISummary(topic) {
        if (aiCache[topic]) return aiCache[topic];
        return new Promise(resolve => {
            setTimeout(() => {
                let summary = `'${topic}'에 대한 AI 분석 결과입니다. 이 개념은 관련 산업에서 프로세스 효율성을 높이고 새로운 부가가치를 창출하는 핵심 요소로 평가받고 있습니다.`;
                
                // 반도체 관련 키워드 사전 분석 로직 (데모용)
                if (topic.includes('전공정') || topic.includes('웨이퍼') || topic.includes('식각')) {
                    summary = `'${topic}'은(는) 반도체 칩 제조의 뼈대를 이루는 핵심 단계로, 나노(nm) 단위의 정밀한 화학적/물리적 제어가 필수적인 고도의 기술 집약적 공정입니다.`;
                } else if (topic.includes('설계') || topic.includes('회로')) {
                    summary = `'${topic}'은(는) 시스템의 두뇌를 기획하는 단계로, 최근 전력 효율과 연산 성능을 최적화하기 위해 AI 기반 자동화 툴(EDA) 도입이 활발하게 이루어지고 있습니다.`;
                } else if (topic.includes('후공정') || topic.includes('테스트')) {
                    summary = `'${topic}'은(는) 제조된 칩을 물리적으로 보호하고 외부 기기와 연결할 수 있도록 패키징하며, 정상 작동 여부를 엄격히 검증하는 필수 마무리 단계입니다.`;
                }
                
                aiCache[topic] = summary;
                resolve(summary);
            }, 600 + Math.random() * 500); // AI 생성 딜레이 모방
        });
    }

    function updateTooltipPosition(clientX, clientY) {
        let x = clientX + 15;
        let y = clientY + 15;
        
        // 툴팁이 화면을 벗어나지 않도록 좌표 보정
        if (x + 280 > window.innerWidth) x = clientX - 295;
        if (y + 150 > window.innerHeight) y = clientY - 165;
        
        aiTooltip.style.left = `${x}px`;
        aiTooltip.style.top = `${y}px`;
    }

    function onNodeEnter(e) {
        if (isPanning || dragState.target) return;
        
        const el = e.currentTarget;
        const textSpan = el.querySelector('.node-text');
        const topic = textSpan ? textSpan.textContent.trim() : el.textContent.trim();

        // 하위 가지 하이라이트 로직
        const hoveredItem = itemsData.find(it => it.el === el);
        if (hoveredItem) {
            const descendantIds = getDescendantIds(hoveredItem.id);
            list.classList.add('has-highlight');
            
            itemsData.forEach((item, index) => {
                const line = svg.querySelectorAll('line')[index];
                if (descendantIds.includes(item.id)) {
                    item.el.classList.add('highlighted');
                    if (line) line.classList.add('highlighted');
                } else {
                    item.el.classList.remove('highlighted');
                    if (line) line.classList.remove('highlighted');
                }
            });
        } else if (el === centerNode) {
            list.classList.add('has-highlight');
            centerNode.classList.add('highlighted');
            itemsData.forEach((item, index) => {
                item.el.classList.add('highlighted');
                const line = svg.querySelectorAll('line')[index];
                if (line) line.classList.add('highlighted');
            });
        }
        
        tooltipTimeout = setTimeout(async () => {
            updateTooltipPosition(e.clientX, e.clientY);
            aiTooltip.innerHTML = `<strong>${topic} (AI 분석)</strong><br><span style="color:#777;">✨ AI가 컨텍스트를 추론 중입니다...</span>`;
            aiTooltip.classList.add('visible');

            const summary = await generateAISummary(topic);
            if (aiTooltip.classList.contains('visible')) {
                aiTooltip.innerHTML = `<strong>${topic} (AI 분석)</strong><br>${summary}`;
                updateTooltipPosition(e.clientX, e.clientY); // 내용 길이에 따른 재조정
            }
        }, 800); // 0.8초 호버 시 표시
    }

    function onNodeLeave(e) {
        clearTimeout(tooltipTimeout);
        aiTooltip.classList.remove('visible');

        // 하이라이트 해제
        list.classList.remove('has-highlight');
        centerNode.classList.remove('highlighted');
        itemsData.forEach((item, index) => {
            item.el.classList.remove('highlighted');
            const line = svg.querySelectorAll('line')[index];
            if (line) line.classList.remove('highlighted');
        });
    }

    function onPointerDown(e) {
        if (!isExpanded || e.button !== 0) return; // 좌클릭(또는 터치)일 때만 드래그/클릭 허용
        
        // 편집 중인 텍스트를 클릭했을 때는 드래그를 막음
        if (e.target.classList.contains('node-text') && e.target.contentEditable === 'true') return;

        const el = e.currentTarget;
        const item = itemsData.find(it => it.el === el);
        if (!item) return;

        dragState.isMoving = false;
        dragState.startX = e.clientX;
        dragState.startY = e.clientY;
        dragState.target = item;

        // 드래그 시작 시 툴팁 숨기기
        clearTimeout(tooltipTimeout);
        aiTooltip.classList.remove('visible');

        // 드래그 시작 시 현재 항목의 위치를 즉시 동기화하여 튀는 현상 방지
        dragState.currentX = dragState.target.tx;
        dragState.currentY = dragState.target.ty;
        
        // 복귀 중인 애니메이션이 있다면 즉시 중단
        const idx = itemsData.indexOf(dragState.target);
        const lines = svg.querySelectorAll('line');
        dragState.target.el.classList.remove('returning');
        if (lines[idx]) lines[idx].classList.remove('returning');

        dragState.target.el.classList.add('dragging');
        dragState.target.el.setPointerCapture(e.pointerId);
    }

    function onPointerMove(e) {
        if (activePointers.has(e.pointerId)) {
            activePointers.set(e.pointerId, e);
        }

        // 핀치 투 줌 처리
        if (activePointers.size === 2) {
            const pts = Array.from(activePointers.values());
            const currentDist = Math.hypot(pts[0].clientX - pts[1].clientX, pts[0].clientY - pts[1].clientY);
            if (initialPinchDist > 0) {
                const delta = currentDist / initialPinchDist;
                zoomScale = Math.min(Math.max(0.3, initialZoomScale * delta), 3);
                updateTransform();
            }
            return; // 줌 중에는 다른 이동 액션 차단
        }

        // 화면 이동 중일 때의 로직
        if (isPanning) {
            panX = initialPanPos.x + (e.clientX - panStartPos.x);
            panY = initialPanPos.y + (e.clientY - panStartPos.y);
            updateTransform();
            return;
        }

        if (!dragState.target) return;
        
        // 드래그 여부 판단 (5px 이상 이동 시 드래그로 간주)
        if (Math.hypot(e.clientX - dragState.startX, e.clientY - dragState.startY) > 5) {
            dragState.isMoving = true;
        }

        // 드래그 중일 때 파티클 효과 생성
        if (dragState.isMoving) {
            createParticle(e.clientX, e.clientY);
            createParticle(e.clientX, e.clientY); // 풍성하게 보이도록 프레임당 2개 생성
        }

        const rect = list.getBoundingClientRect();
        const centerX = rect.width / 2;
        const centerY = rect.height / 2;
        
        // 줌 배율 및 화면 이동(Pan)을 모두 고려하여 마우스의 실제 캔버스 좌표 보정
        const mouseXInZoom = (e.clientX - (rect.left + centerX) - panX) / zoomScale;
        const mouseYInZoom = (e.clientY - (rect.top + centerY) - panY) / zoomScale;

        // 물리 엔진은 절대 상대 좌표를 사용하므로 마우스 좌표를 바로 전달
        dragState.currentX = mouseXInZoom;
        dragState.currentY = mouseYInZoom;
        
        // 노드 안에서 마우스가 움직일 때 툴팁 위치도 부드럽게 갱신
        if (aiTooltip.classList.contains('visible')) {
            updateTooltipPosition(e.clientX, e.clientY);
        }
    }

    function onPointerUp(e) {
        activePointers.delete(e.pointerId);
        if (activePointers.size < 2) {
            initialPinchDist = 0;
            // 핀치 종료 후 남은 한 손가락으로 패닝이 이어질 때 화면 튀는 현상 방지
            if (activePointers.size === 1 && isPanning) {
                const remaining = Array.from(activePointers.values())[0];
                panStartPos = { x: remaining.clientX, y: remaining.clientY };
                initialPanPos = { x: panX, y: panY };
            }
        }

        if (isPanning && activePointers.size === 0) {
            isPanning = false;
            zoomLayer.style.transition = 'transform 0.1s ease-out';
            list.classList.remove('panning');
            return;
        }

        if (!dragState.target) return;
        
        const releasedItem = dragState.target.el;
        const topic = releasedItem.querySelector('.node-text').textContent.trim();

        releasedItem.classList.remove('dragging');
        
        const targetData = dragState.target;
        dragState.target = null;
    }

    function arrangeItems() {
        const lines = svg.querySelectorAll('line');
        const centerX = list.offsetWidth / 2;
        const centerY = list.offsetHeight / 2;
        
        itemsData.forEach((item, i) => {
            const absX = centerX + item.tx;
            const absY = centerY + item.ty;
            const dotOffset = 5; // 점의 반경(10px / 2 = 5px)에 맞춰 정확하게 선의 끝점을 조율
            
            item.el.style.setProperty('--tx', `${item.tx}px`);
            item.el.style.setProperty('--ty', `${item.ty}px`);
            item.el.style.transform = `translate(calc(${item.tx}px - ${dotOffset}px), calc(${item.ty}px - 50%))`;

            const line = lines[i];
            if (line) {
                if (isExpanded) {
                    let parentX = centerX;
                    let parentY = centerY;
                    if (item.parentId) {
                        const parent = itemsData.find(p => p.id === item.parentId);
                        if (parent) {
                            parentX = centerX + parent.tx;
                            parentY = centerY + parent.ty;
                        }
                    }
                    line.setAttribute('x1', parentX);
                    line.setAttribute('y1', parentY);
                    line.setAttribute('x2', absX);
                    line.setAttribute('y2', absY);
                    
                    // 연관성(Relevance) 점수에 따라 선의 굵기, 투명도를 조절 (색상은 그레이로 고정)
                    const rel = item.relevance !== undefined ? item.relevance : 1;
                    line.style.stroke = '#777'; // 커넥터 컬러를 그레이로 통일
                    line.style.strokeWidth = item.el.classList.contains('sub-item') ? `${0.5 + rel * 1.5}px` : '2px';
                    line.style.strokeOpacity = 0.2 + (rel * 0.8); // 낮을수록 옅은 색(투명)
                } else {
                    line.setAttribute('x1', centerX);
                    line.setAttribute('y1', centerY);
                    line.setAttribute('x2', centerX);
                    line.setAttribute('y2', centerY);
                    line.style.strokeOpacity = 0;
                }
            }
        });
    }
    init();
</script>
</body>
</html>
