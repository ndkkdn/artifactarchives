<style>
  :root {
    --bg: #ececea;
    --bg-2: #e2e2df;
    --surface: #f7f7f5;
    --text: #111014;

    --accent: #ff5a1f;
    --floor: rgba(20, 18, 30, .22);
    --dim: 236, 236, 234;
    --sky: #d8ddf0; --sky-rgb: 216, 221, 240; --panel: rgba(216, 221, 240, .78);
    --hl: #f0542a; --hl-text: #fff; --sub-bg: rgba(190, 197, 228, .92);
    --logo-ink: #14253B; --logo-box: #14253B; --logo-lid-back: #203A57;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #101012; --bg-2: #18181b; --surface: #1c1c20; --text: #f1f0ec;
      --text-60: rgba(241, 240, 236, .6); --text-40: rgba(241, 240, 236, .4); --line: rgba(241, 240, 236, .12);
      --btn: rgba(255, 255, 255, .08); --btn-hover: rgba(255, 255, 255, .18); --accent: #ff7a45;
      --floor: rgba(0, 0, 0, .6); --dim: 16, 16, 18; color-scheme: dark;
      --sky: #14152a; --sky-rgb: 20, 21, 42; --panel: rgba(20, 21, 42, .74); --hl: #e0491f; --hl-text: #fff; --sub-bg: rgba(40, 43, 76, .92); --logo-ink: #F3EFE4; --logo-box: #2E5079; --logo-lid-back: #22405F;
    }
  }
  :root[data-theme="dark"] {
    --bg: #101012; --bg-2: #18181b; --surface: #1c1c20; --text: #f1f0ec;
    --text-60: rgba(241, 240, 236, .6); --text-40: rgba(241, 240, 236, .4); --line: rgba(241, 240, 236, .12);
    --btn: rgba(255, 255, 255, .08); --btn-hover: rgba(255, 255, 255, .18); --accent: #ff7a45;
    --floor: rgba(0, 0, 0, .6); --dim: 16, 16, 18; color-scheme: dark;
      --sky: #14152a; --sky-rgb: 20, 21, 42; --panel: rgba(20, 21, 42, .74); --hl: #e0491f; --hl-text: #fff; --sub-bg: rgba(40, 43, 76, .92); --logo-ink: #F3EFE4; --logo-box: #2E5079; --logo-lid-back: #22405F;
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: Inter, "Pretendard Variable", Pretendard, -apple-system, system-ui, sans-serif;
    font-size: 14px; letter-spacing: -.01em;
    -webkit-font-smoothing: antialiased; word-break: keep-all; overflow-x: clip;
    transition: background-color .4s;
  }
  body.stage-mode { overflow: hidden; overscroll-behavior: none; background: var(--sky); }
  .bg-layer { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; display: none; }
  body.stage-mode .bg-layer { display: block; }
  #bg-cloud, #bg-sea { image-rendering: pixelated; image-rendering: crisp-edges; }
  /* the sea is drawn one pixel per cell; this mask turns every cell into a round dot */
  #bg-sea {
    -webkit-mask-image: radial-gradient(circle at center, #000 0 44%, transparent 50%); mask-image: radial-gradient(circle at center, #000 0 44%, transparent 50%);
    -webkit-mask-size: var(--cell, 6px) var(--cell, 6px); mask-size: var(--cell, 6px) var(--cell, 6px);
  }
  /* the top bar sits on the sky, so its text follows how bright the sky is right now (bg.js sets the class) */
  body.stage-mode.sky-dark .bar, body.stage-mode.sky-dark .counter, body.stage-mode.sky-dark .nav-arrows {
    --text: #f4f3ee; --text-60: rgba(244, 243, 238, .74); --text-40: rgba(244, 243, 238, .5); --line: rgba(255, 255, 255, .2);
    --btn: rgba(255, 255, 255, .12); --btn-hover: rgba(255, 255, 255, .24); --bg: #14152a;
    --logo-ink: #F3EFE4; --logo-box: #2E5079; --logo-lid-back: #22405F; color: var(--text);
  }
  /* the subtitle strip follows the sky too */
  body.stage-mode.sky-dark .lede p span { background: rgba(14, 16, 42, .72); color: #f4f3ee; }
  body.stage-mode.sky-light .lede p span { background: rgba(255, 255, 255, .7); color: #111014; }
  .lede p span { transition: background-color 1.2s, color 1.2s; }
  body.stage-mode.sky-light .bar, body.stage-mode.sky-light .counter, body.stage-mode.sky-light .nav-arrows {
    --text: #111014; --text-60: rgba(17, 16, 20, .64); --text-40: rgba(17, 16, 20, .44); --line: rgba(17, 16, 20, .12);
    --btn: rgba(255, 255, 255, .6); --btn-hover: rgba(255, 255, 255, .9); --bg: #ececea;
    --logo-ink: #14253B; --logo-box: #14253B; --logo-lid-back: #203A57; color: var(--text);
  }
  main { position: relative; z-index: 1; }
  body.stage-mode .stage { --dim: var(--sky-rgb); }
  button { font: inherit; color: inherit; letter-spacing: inherit; }
  a { color: inherit; }
  .mono { font-family: "JetBrains Mono", ui-monospace, monospace; letter-spacing: 0; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 4px; }

  /* ── top bar ───────────────────────────────── */
  .bar {
    position: fixed; inset: 0 0 auto 0; z-index: 30;
    padding: env(safe-area-inset-top, 0px) max(20px, env(safe-area-inset-right, 0px)) 0 max(20px, env(safe-area-inset-left, 0px));
  }
  .bar-in { height: 56px; display: flex; align-items: center; gap: 28px; max-width: 1680px; margin: 0 auto; }
  .brand { display: flex; align-items: center; text-decoration: none; flex: none; border-radius: 10px; }
  .brand svg { display: block; height: 40px; width: auto; overflow: visible; }
  .brand .logo-mark { display: none; height: 36px; }
  .install-btn[hidden] { display: none; }
  .tabs { display: flex; align-items: center; gap: 6px; flex: 1; min-width: 0; }
  .tab {
    appearance: none; border: 0; height: 32px; width: 40px; padding: 0; border-radius: 999px; cursor: pointer;
    display: inline-grid; place-items: center; flex: none;
    background: var(--btn); color: var(--text-60); font-size: 13.5px; font-weight: 500; white-space: nowrap;
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); transition: background .3s, color .3s;
  }
  .tab svg { width: 16px; height: 16px; }
  .tab sup { font-size: 10.5px; color: var(--text-40); font-family: "JetBrains Mono", monospace; vertical-align: 0; line-height: 1; transition: color .3s; }
  .tab:hover { background: var(--btn-hover); color: var(--text); }
  .tab[aria-pressed="true"] { background: var(--text); color: var(--bg); }
  .tab[aria-pressed="true"] sup { color: var(--bg); opacity: .65; }
  .actions { display: flex; gap: 8px; align-items: center; margin-left: auto; }
  .toolgroup { display: flex; align-items: center; gap: 2px; background: var(--btn); border-radius: 999px; padding: 3px; backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); flex: none; }
  .tg-views { display: flex; gap: 2px; }
  .tg-btn {
    appearance: none; border: 0; background: transparent; width: 34px; height: 30px; border-radius: 999px; cursor: pointer;
    display: grid; place-items: center; color: var(--text-60); text-decoration: none; transition: background .3s, color .3s;
  }
  .tg-btn svg { width: 16px; height: 16px; }
  .tg-btn:hover { background: var(--btn-hover); color: var(--text); }
  .tg-btn[aria-pressed="true"] { background: var(--text); color: var(--bg); }
  .tg-sep { width: 1px; height: 16px; background: var(--line); margin: 0 3px; }
  .season-btn.spin svg { animation: seasonSpin .5s var(--ease, cubic-bezier(.2,.8,.2,1)); }
  @keyframes seasonSpin { from { transform: rotate(-90deg) scale(.6); opacity: 0; } to { transform: none; opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .season-btn.spin svg { animation: none; } }
  .round {
    appearance: none; border: 0; background: var(--btn); width: 36px; height: 36px; border-radius: 50%;
    display: grid; place-items: center; cursor: pointer; text-decoration: none; transition: background .3s;
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); flex: none;
  }
  .round:hover { background: var(--btn-hover); }
  .round svg { width: 16px; height: 16px; }

  /* ── stage view ────────────────────────────── */
  .stage {
    position: relative; height: 100vh; height: 100dvh; display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr) auto auto;
    padding-top: calc(56px + env(safe-area-inset-top, 0px));
    --cw: min(600px, 58vw, calc((100dvh - 560px) * 1.7778));
    --ch: calc(var(--cw) * .5625);
  }
  .stage[hidden], .index[hidden] { display: none; }
  .lede { padding: 18px max(20px, env(safe-area-inset-left, 0px)) 0; max-width: 1680px; width: 100%; margin: 0 auto; text-align: center; }
  /* highlighter-style service title: each wrapped line gets its own block */
  .lede h1 { margin: 0; font-family: Inter, sans-serif; font-size: clamp(28px, min(4.6vw, 6.3vh), 68px); font-weight: 700; letter-spacing: -.045em; line-height: 1.16; }
  .lede h1 span { background: var(--hl); color: var(--hl-text); transition: background-color 1.2s, color 1.2s; padding: 0 .2em; -webkit-box-decoration-break: clone; box-decoration-break: clone; }
  /* subtitle: Paperlogy SemiBold (SIL OFL, via jsDelivr/project noonnu) */
  @font-face { font-family: "Paperlogy"; font-weight: 600; font-style: normal; font-display: swap; src: url("https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-6SemiBold.woff2") format("woff2"); }
  .lede p { margin: 14px 0 0; font-family: "Paperlogy", "Pretendard Variable", Pretendard, sans-serif; font-size: 18px; font-weight: 600; letter-spacing: -.01em; }
  .lede p span { background: var(--sub-bg); color: var(--text); padding: 4px 11px; -webkit-box-decoration-break: clone; box-decoration-break: clone; line-height: 1.8; }

  .scene { position: relative; perspective: 1700px; perspective-origin: 50% 45%; touch-action: pan-y; cursor: grab; user-select: none; -webkit-user-select: none; overflow: hidden; }
  .scene.dragging { cursor: grabbing; }
  /* the wrapper sits at z=0 in front of the receding side covers, so let clicks pass through it */
  #sleeves { position: absolute; inset: 0; transform-style: preserve-3d; pointer-events: none; }
  #sleeves .sleeve { pointer-events: auto; }
  .sleeve {
    position: absolute; left: 50%; top: 50%; width: var(--cw); height: var(--ch);
    margin: calc(var(--ch) / -2) 0 0 calc(var(--cw) / -2);
    border-radius: 6px; transform-style: preserve-3d; will-change: transform; display: block;
    text-decoration: none; -webkit-tap-highlight-color: transparent;
  }
  .sleeve .face {
    position: absolute; inset: 0; border-radius: inherit; overflow: hidden; background: var(--bg-2);
    box-shadow: 0 1px 0 rgba(255,255,255,.4) inset, 0 2px 4px rgba(0,0,0,.06), 0 24px 48px -16px var(--floor);
    transition: box-shadow .4s, transform .5s cubic-bezier(.2,.8,.2,1);
  }
  .sleeve img { width: 100%; height: 100%; object-fit: cover; object-position: top center; display: block; -webkit-user-drag: none; pointer-events: none; }
  .sleeve .face::after { content: ""; position: absolute; inset: 0; background: rgb(var(--dim)); opacity: var(--shade, 0); pointer-events: none; }
  .sleeve::after {
    content: ""; position: absolute; left: 6%; right: 6%; bottom: -26px; height: 22px; border-radius: 50%;
    background: radial-gradient(closest-side, var(--floor), transparent); filter: blur(6px); opacity: var(--floorop, .6); pointer-events: none;
  }
  .sleeve.on { cursor: pointer; }
  /* the selected cover gets a thin glowing ring whose light slowly travels around the edge */
  @property --ring { syntax: '<angle>'; inherits: false; initial-value: 0deg; }
  .sleeve::before {
    content: ""; position: absolute; inset: -6px; border-radius: 12px; padding: 2px; pointer-events: none;
    background: conic-gradient(from var(--ring), var(--hl) 0deg, rgba(255,255,255,.95) 40deg, var(--hl) 90deg, color-mix(in srgb, var(--hl) 30%, transparent) 180deg, var(--hl) 270deg, rgba(255,255,255,.95) 310deg, var(--hl) 360deg);
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor;
    mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0);
    opacity: 0; transform: scale(.985); transition: opacity .45s, transform .45s cubic-bezier(.2,.8,.2,1), filter .45s;
    filter: drop-shadow(0 0 10px color-mix(in srgb, var(--hl) 55%, transparent));
  }
  .sleeve.on::before { opacity: 1; transform: none; animation: ringSpin 7s linear infinite; }
  .sleeve.on:hover::before { transform: translateY(-6px); filter: drop-shadow(0 0 16px color-mix(in srgb, var(--hl) 75%, transparent)); }
  @keyframes ringSpin { to { --ring: 360deg; } }
  .sleeve.on:hover .face { transform: translateY(-6px); box-shadow: 0 1px 0 rgba(255,255,255,.4) inset, 0 2px 4px rgba(0,0,0,.06), 0 36px 60px -18px var(--floor); }
  .open-hint {
    position: absolute; right: 12px; bottom: 12px; padding: 7px 12px; border-radius: 999px; font-weight: 500; font-size: 13px;
    background: rgba(17,16,20,.82); color: #fff; opacity: 0; transform: translateY(4px); transition: opacity .3s, transform .3s; pointer-events: none;
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  }
  .sleeve.on:hover .open-hint, .sleeve.on:focus-visible .open-hint { opacity: 1; transform: none; }

  .nav-arrows { position: absolute; inset: 0; pointer-events: none; display: flex; align-items: center; justify-content: space-between; padding: 0 max(20px, env(safe-area-inset-left, 0px)); z-index: 200; }
  .nav-arrows .round { pointer-events: auto; width: 40px; height: 40px; }
  .nav-arrows .round[disabled] { opacity: .3; cursor: default; }

  .caption {
    text-align: center; padding: 12px 22px 14px; min-height: 132px; max-width: 660px; width: calc(100% - 32px); margin: 0 auto 14px;
    background: var(--panel); border-radius: 14px; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    display: flex; flex-direction: column; align-items: center; gap: 8px;
  }
  .caption .kicker { display: flex; gap: 10px; align-items: center; color: var(--text-60); font-size: 12px; }
  .caption .kicker .new { color: var(--accent); font-weight: 600; }
  .caption h2 { margin: 0; font-size: 22px; font-weight: 600; letter-spacing: -.025em; line-height: 1.25; }
  .caption p {
    margin: 0; color: var(--text-60); line-height: 1.5; font-size: 14px;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .caption > * { animation: cap .5s both cubic-bezier(.2,.8,.2,1); }
  .caption > :nth-child(2) { animation-delay: 40ms; }
  .caption > :nth-child(3) { animation-delay: 80ms; }
  @keyframes cap { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  .strip-wrap { margin: 0 max(16px, env(safe-area-inset-left, 0px)) max(12px, env(safe-area-inset-bottom, 0px)); position: relative; background: var(--panel); border-radius: 14px; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); overflow: hidden; }
  .strip-wrap::before, .strip-wrap::after { content: ""; position: absolute; top: 0; bottom: 0; width: 40px; z-index: 1; pointer-events: none; }
  .strip-wrap::before { left: 0; background: linear-gradient(90deg, var(--panel), transparent); }
  .strip-wrap::after { right: 0; background: linear-gradient(-90deg, var(--panel), transparent); }
  .strip { display: flex; gap: 10px; overflow-x: auto; scrollbar-width: none; padding: 18px 40px 22px; scroll-behavior: smooth; }
  .strip::-webkit-scrollbar { display: none; }
  .chip {
    appearance: none; border: 0; background: none; padding: 0; text-align: left; cursor: pointer; flex: none; width: 128px;
    color: var(--text-60); transition: color .4s;
  }
  .chip small { display: flex; gap: 6px; font-size: 11px; margin-bottom: 4px; color: var(--text-40); transition: color .4s; }
  .chip small .new { color: var(--accent); }
  .chip span { display: inline; font-size: 11.5px; line-height: 1.3; background: linear-gradient(currentColor, currentColor) 0 100% / 0 1px no-repeat; transition: background-size .4s; }
  .chip:hover, .chip[aria-current="true"] { color: var(--text); }
  .chip:hover small, .chip[aria-current="true"] small { color: var(--text-60); }
  .chip[aria-current="true"] span, .chip:hover span { background-size: 100% 1px; }
  .chip .t { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

  .counter { position: absolute; right: max(20px, env(safe-area-inset-right, 0px)); top: calc(56px + env(safe-area-inset-top, 0px) + 14px); color: var(--text-60); font-size: 12px; z-index: 5; }
  .counter b { color: var(--text); font-weight: 500; }

  /* ── index (list) view ─────────────────────── */
  .index { max-width: 1280px; margin: 0 auto; padding: calc(56px + env(safe-area-inset-top, 0px) + 56px) max(20px, env(safe-area-inset-right, 0px)) 0 max(20px, env(safe-area-inset-left, 0px)); }
  .index-head { display: flex; align-items: end; justify-content: space-between; gap: 20px; flex-wrap: wrap; padding-bottom: 28px; }
  .index-head h2 { margin: 0; font-size: clamp(32px, 5vw, 56px); font-weight: 500; letter-spacing: -.045em; line-height: 1.02; }
  .index-head h2 em { font-style: normal; color: var(--text-40); }
  .search { display: flex; align-items: center; gap: 10px; background: var(--btn); border-radius: 6px; height: 44px; padding: 0 14px; flex: 0 1 340px; min-width: 0; }
  .search:focus-within { background: var(--btn-hover); box-shadow: 0 0 0 1px var(--text); }
  .search svg { width: 16px; height: 16px; color: var(--text-40); flex: none; }
  .search input { border: 0; outline: 0; background: transparent; font: inherit; font-size: 16px; color: var(--text); width: 100%; min-width: 0; }
  kbd { font-family: "JetBrains Mono", monospace; font-size: 11px; color: var(--text-40); background: var(--bg-2); border-radius: 4px; padding: 2px 7px; }

  .rows { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
  .rows a {
    display: grid; grid-template-columns: 48px minmax(0, 1.4fr) minmax(0, 1fr) 90px 96px; gap: 20px; align-items: baseline;
    padding: 18px 0; border-bottom: 1px solid var(--line); text-decoration: none; color: var(--text-60);
    transition: color .3s, padding .4s cubic-bezier(.2,.8,.2,1);
  }
  .rows a:hover, .rows a:focus-visible { color: var(--text); padding-left: 10px; }
  .rows .n { font-size: 12px; color: var(--text-40); }
  .rows .ti { color: var(--text); font-size: 17px; font-weight: 500; letter-spacing: -.02em; line-height: 1.35; }
  .rows .ti .new { font-size: 10px; font-weight: 600; color: var(--accent); vertical-align: 3px; margin-left: 6px; letter-spacing: .04em; }
  .rows .de { font-size: 13px; line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .rows .ty, .rows .dt { font-size: 12px; }
  .rows .dt { text-align: right; }
  .empty { padding: 60px 0; color: var(--text-60); text-align: center; border-bottom: 1px solid var(--line); }
  .peek {
    position: fixed; left: 0; top: 0; width: 320px; aspect-ratio: 16 / 9; border-radius: 6px; overflow: hidden; z-index: 40; pointer-events: none;
    box-shadow: 0 30px 60px -20px var(--floor); opacity: 0; transform: scale(.94); transition: opacity .25s, transform .25s; background: var(--bg-2);
  }
  .peek.show { opacity: 1; transform: none; }
  .peek img { width: 100%; height: 100%; object-fit: cover; object-position: top center; display: block; }
  footer { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding: 40px 0 calc(48px + env(safe-area-inset-bottom, 0px)); color: var(--text-40); font-size: 12px; }

  /* ── intro loader ──────────────────────────── */
  .loader { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; background: var(--sky); transition: opacity .5s, visibility .5s; }
  .loader.done { opacity: 0; visibility: hidden; }
  .loader div { width: 140px; height: 6px; border-radius: 999px; background: var(--line); overflow: hidden; }
  .loader div i { display: block; height: 100%; width: 0; background: var(--text); border-radius: inherit; transition: width .3s; }

  /* ── admin (hidden unless body.admin) ──── */
  .admin-only { display: none !important; }
  body.admin .admin-only { display: flex !important; }
  .pill {
    appearance: none; border: 0; background: var(--btn); height: 30px; padding: 0 12px; border-radius: 999px; cursor: pointer;

  /* ── responsive ────────────────────────────── */

  }
  /* list rows on tablets/phones: show the type under the title so same-titled items are told apart */
  @media (max-width: 900px) {

    .rows .n, .rows .ti, .rows .dt { grid-row: 1; }

  }

  /* narrow phones: keep every top-bar control on screen */

  /* short phones held upright: shrink the chrome so the cover gets the room */
  @media (max-width: 620px) and (max-height: 720px) {
    .lede { padding-top: 8px; }

  /* opening an item: its cover grows from where it sits to fill the screen, then the page loads underneath */
  .launch-bg { position: fixed; inset: 0; z-index: 998; background: var(--bg); pointer-events: none; opacity: 0; }
  .launch { position: fixed; z-index: 999; overflow: hidden; border-radius: 6px; background: var(--bg-2); pointer-events: none;

<script>

  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const isNew = d => (Date.now() - new Date(d)) / 864e5 < 7;
  const short = d => d.slice(5).replace('-', '.');
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const byDate = (a, b) => b.date.localeCompare(a.date);
  let all = (Array.isArray(window.ITEMS) ? window.ITEMS : []).slice().sort(byDate);
  let types = [];
  const count = t => t === '전체' ? all.length : all.filter(i => i.type === t).length;

  let active = '전체';
  let list = all;
  let view = 'stage';
  let pos = 0, target = 0, shown = -1, raf = 0, lastT = 0;
  const sleevesEl = $('sleeves'), stripEl = $('strip'), scene = $('scene');

  /* filters */
  const TAB_ICONS = {
    '전체': '<rect x="2.5" y="2.5" width="4.5" height="4.5" rx="1"/><rect x="9" y="2.5" width="4.5" height="4.5" rx="1"/><rect x="2.5" y="9" width="4.5" height="4.5" rx="1"/><rect x="9" y="9" width="4.5" height="4.5" rx="1"/>',
    '리포트': '<path d="M4 1.8h5.2L12.5 5v9.2H4z"/><path d="M9 1.8V5h3.5M6 8h4.5M6 10.6h4.5"/>',
    '슬라이드': '<rect x="1.8" y="2.5" width="12.4" height="8.5" rx="1.2"/><path d="M8 11v2.6M5.5 13.8h5"/>',
    '설명서': '<path d="M8 4.2C6.6 3 4.4 2.6 2 2.8v9.6c2.4-.2 4.6.2 6 1.4 1.4-1.2 3.6-1.6 6-1.4V2.8c-2.4-.2-4.6.2-6 1.4z"/><path d="M8 4.2v9.6"/>',
  };
  const TAB_DEFAULT = '<path d="M2.5 8.6V2.5h6.1l5 5-6.1 6.1z"/><circle cx="5.6" cy="5.6" r="1"/>';
  const tabIcon = t => `<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true">${TAB_ICONS[t] || TAB_DEFAULT}</svg>`;
  function renderTabs() {
    types = ['전체', ...new Set(all.map(i => i.type))];
    if (!types.includes(active)) active = '전체';
    $('tabs').innerHTML = types.map(t => `<button class="tab" type="button" aria-pressed="${t === active}" data-t="${esc(t)}" title="${esc(t)} ${count(t)}개" aria-label="${esc(t)} ${count(t)}개">${tabIcon(t)}</button>`).join('');
  }
  $('tabs').addEventListener('click', e => {
    const b = e.target.closest('.tab'); if (!b) return;
    active = b.dataset.t;
    $('tabs').querySelectorAll('.tab').forEach(x => x.setAttribute('aria-pressed', x === b));
    list = all.filter(i => active === '전체' || i.type === active);
    buildStage(); renderIndex();
  });

  // replace the whole data set (used by the admin editor) and keep focus on `focusHref` when given
  function setItems(items, focusHref) {
    all = items.slice().sort(byDate);
    renderTabs();
    list = all.filter(i => active === '전체' || i.type === active);
    buildStage(); renderIndex();
    const n = list.findIndex(i => i.href === focusHref);
    if (n >= 0) { pos = target = n; shown = -1; layout(); }
  }

  /* ── stage ─────────────────────────────── */
  function buildStage() {
    sleevesEl.innerHTML = list.map((i, n) => `
      <a class="sleeve" href="${esc(i.href)}" data-n="${n}"${/스크롤형/.test(i.title) ? ' data-live="1"' : ''} tabindex="-1" aria-label="${esc(i.title)} 열기" draggable="false">
        <div class="face"><img src="${esc(i._preview || i.thumb)}" alt="" draggable="false" ${n > 6 ? 'loading="lazy"' : ''}><span class="open-hint">열기 ↗</span></div>
      </a>`).join('');
    stripEl.innerHTML = list.map((i, n) => `
      <button class="chip" type="button" data-n="${n}">
        <small class="mono">${short(i.date)}<span style="background:none">${esc(i.type)}</span>${isNew(i.date) ? '<span class="new" style="background:none">NEW</span>' : ''}</small>
        <div class="t"><span>${esc(i.title)}</span></div>
      </button>`).join('');
    pos = target = 0; shown = -1;
    layout(); kick();
  }

  function layout() {
    const cards = sleevesEl.children;
    const W = sleevesEl.firstElementChild ? sleevesEl.firstElementChild.offsetWidth : 500;
    for (let n = 0; n < cards.length; n++) {
      const d = n - pos, a = Math.abs(d), s = Math.sign(d);
      const near = Math.min(a, 1), far = Math.max(a - 1, 0);
      // the front cover is full size; side covers shrink a little so the selected one stands out
      const x = s * (near * W * .6 + far * W * .17);
      const z = -near * W * .42 - far * W * .1;
      const ry = -Math.max(-1, Math.min(1, d)) * 58;
      const sc = 1 - near * .16;
      const c = cards[n];
      c.style.transform = `translate3d(${x.toFixed(1)}px,0,${z.toFixed(1)}px) rotateY(${ry.toFixed(2)}deg) scale(${sc.toFixed(3)})`;
      c.style.zIndex = 100 - Math.round(a * 10);
      c.style.opacity = a > 5.5 ? Math.max(0, 6.5 - a) : 1;
      c.style.visibility = a > 6.5 ? 'hidden' : 'visible';
      c.style.setProperty('--shade', Math.min(.55, a * .22).toFixed(3));
      c.style.setProperty('--floorop', (.6 - Math.min(.5, a * .25)).toFixed(3));
    }
    const cur = clamp(Math.round(pos));
    if (!list.length && shown !== -2) { shown = -2; $('caption').innerHTML = '<p>아직 아티팩트가 없습니다.</p>'; $('counter').textContent = ''; }
    else if (list.length && cur !== shown) { shown = cur; showCaption(cur); }
  }

  function showCaption(n) {
    const i = list[n];
    $('caption').innerHTML = `
      <div class="kicker mono"><span>${esc(i.type)}</span><span>·</span><span>${i.date}</span>${isNew(i.date) ? '<span class="new">NEW</span>' : ''}</div>
      <h2>${esc(i.title)}</h2>
      <p>${esc(i.desc)}</p>
      <div class="admin-only cap-actions">
        <button type="button" class="pill" data-act="edit" data-href="${esc(i.href)}">수정</button>
        <button type="button" class="pill danger" data-act="delete" data-href="${esc(i.href)}">삭제</button>
      </div>`;
    $('counter').innerHTML = `<b>${String(n + 1).padStart(2, '0')}</b> / ${String(list.length).padStart(2, '0')}`;
    [...sleevesEl.children].forEach((c, k) => { c.classList.toggle('on', k === n); c.tabIndex = k === n ? 0 : -1; });
    [...stripEl.children].forEach((c, k) => c.setAttribute('aria-current', k === n));
    const chip = stripEl.children[n];
    if (chip) stripEl.scrollTo({ left: chip.offsetLeft - stripEl.clientWidth / 2 + chip.offsetWidth / 2, behavior: reduced ? 'auto' : 'smooth' });
    $('prev').disabled = n === 0; $('next').disabled = n === list.length - 1;
  }

  function tick(t) {
    const dt = Math.min(.05, (t - (lastT || t)) / 1000); lastT = t;
    const k = reduced ? 1 : 1 - Math.exp(-dt * 9);
    pos += (target - pos) * k;
    if (Math.abs(target - pos) < .0008) pos = target;
    layout();
    raf = pos !== target ? requestAnimationFrame(tick) : 0;
    if (!raf) lastT = 0;
  }
  function kick() { if (!raf) raf = requestAnimationFrame(tick); }
  const clamp = v => Math.max(0, Math.min(list.length - 1, v));
  function go(n) { target = clamp(Math.round(n)); kick(); }

  $('prev').onclick = () => go(target - 1);
  $('next').onclick = () => go(target + 1);
  stripEl.addEventListener('click', e => { const b = e.target.closest('.chip'); if (b) go(+b.dataset.n); });

  // wheel / trackpad: free scroll, then settle on the nearest cover
  // a mouse-wheel notch always moves at least one cover; trackpads glide and settle in the direction of travel
  let snapT, wheelFrom = null;
  scene.addEventListener('wheel', e => {
    e.preventDefault();
    const d = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
    if (!d) return;
    if (wheelFrom === null) wheelFrom = Math.round(target);
    target = clamp(target + d * (e.deltaMode ? .33 : .0045));
    kick();
    clearTimeout(snapT);
    snapT = setTimeout(() => {
      const moved = target - wheelFrom;
      go(Math.abs(moved) < .05 ? wheelFrom : wheelFrom + Math.sign(moved) * Math.max(1, Math.round(Math.abs(moved))));
      wheelFrom = null;
    }, 140);
  }, { passive: false });

  // drag / swipe
  let drag = null;
  scene.addEventListener('pointerdown', e => {
    if (e.button !== 0 || e.target.closest('.round')) return;
    drag = { x: e.clientX, y: e.clientY, start: target, moved: false, id: e.pointerId, w: sleevesEl.firstElementChild?.offsetWidth || 500 };
  });
  scene.addEventListener('pointermove', e => {
    if (!drag || e.pointerId !== drag.id) return;
    const dx = e.clientX - drag.x;
    if (!drag.moved && Math.abs(dx) > 6 && Math.abs(dx) > Math.abs(e.clientY - drag.y)) {
      drag.moved = true; scene.classList.add('dragging');
      try { scene.setPointerCapture(e.pointerId); } catch (_) {}
    }
    if (drag.moved) { target = clamp(drag.start - dx / (drag.w * .42)); kick(); }
  });
  const endDrag = e => {
    if (!drag || e.pointerId !== drag.id) return;
    const moved = drag.moved;
    scene.classList.remove('dragging');
    if (moved) { go(target); scene.dataset.justDragged = '1'; setTimeout(() => delete scene.dataset.justDragged, 0); }
    drag = null;
  };
  scene.addEventListener('pointerup', endDrag);
  scene.addEventListener('pointercancel', endDrag);

  /* open an item with a "launch" zoom: the cover grows from its spot to full screen, then we navigate */
  let launching = false;
  const plainClick = e => !(e.metaKey || e.ctrlKey || e.shiftKey || e.altKey || e.button > 0);
  function launch(href, fromEl, src, live) {
    if (launching) return;
    if (reduced || !fromEl || !src) { location.href = href; return; }
    launching = true;
    const r = fromEl.getBoundingClientRect(), W = innerWidth, H = innerHeight;
    const bg = document.createElement('div'); bg.className = 'launch-bg';
    const card = document.createElement('div'); card.className = 'launch';
    // reuse the cover's already-decoded image so the card is never blank while it grows
    const own = fromEl.querySelector('img');
    const img = own && own.complete && own.naturalWidth ? own.cloneNode() : Object.assign(new Image(), { src });
    img.alt = ''; img.removeAttribute('loading'); img.removeAttribute('style');
    // scroll-type pages: load the real page at full window size behind the thumbnail and scale it with the card
    let frame = null, ready = !live;
    if (live) {
      frame = document.createElement('iframe');
      frame.src = href + (href.includes('?') ? '&' : '?') + 'launch';
      frame.tabIndex = -1; frame.setAttribute('aria-hidden', 'true'); frame.title = '';
      frame.style.width = W + 'px'; frame.style.height = H + 'px';
      frame.onload = () => requestAnimationFrame(() => requestAnimationFrame(() => { ready = true; img.style.opacity = '0'; }));
      card.appendChild(frame);
    }
    card.appendChild(img);
    const rad0 = parseFloat(getComputedStyle(fromEl).borderTopLeftRadius) || 6;
    const k = .03, r1 = { x: r.left + r.width * k / 2, y: r.top + r.height * k / 2, w: r.width * (1 - k), h: r.height * (1 - k) };
    const lerp = (a, b, t) => a + (b - a) * t;
    const inOut = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
    const place = (x, y, w, h, rad) => {
      Object.assign(card.style, { left: x + 'px', top: y + 'px', width: w + 'px', height: h + 'px', borderRadius: rad + 'px' });
      if (frame) frame.style.transform = `scale(${w / W})`;
    };
    place(r.left, r.top, r.width, r.height, rad0);
    document.body.append(bg, card);
    fromEl.style.visibility = 'hidden';
    let gone = false;
    const goNow = () => {
      if (gone) return; gone = true;
      if (live) try { sessionStorage.setItem('archive-launch', new URL(href, location.href).pathname); } catch (_) {}
      location.href = href;
    };
    // scroll-type: no press-in; every corner of the cover heads straight for the matching corner of the screen
    // others: a quick press-in, then the card swells out to the edges of the screen
    const DUR = live ? 820 : 640, PRESS = .14, t0 = performance.now();
    const step = now => {
      const p = Math.min(1, (now - t0) / DUR);
      if (live) { const q = inOut(p); place(lerp(r.left, 0, q), lerp(r.top, 0, q), lerp(r.width, W, q), lerp(r.height, H, q), lerp(rad0, 0, q)); }
      else if (p < PRESS) { const q = 1 - Math.pow(1 - p / PRESS, 2); place(lerp(r.left, r1.x, q), lerp(r.top, r1.y, q), lerp(r.width, r1.w, q), lerp(r.height, r1.h, q), rad0); }
      else { const q = inOut((p - PRESS) / (1 - PRESS)); place(lerp(r1.x, 0, q), lerp(r1.y, 0, q), lerp(r1.w, W, q), lerp(r1.h, H, q), lerp(rad0, 0, q)); }
      bg.style.opacity = live ? Math.max(0, Math.min(1, (p - .45) / .5)) : Math.max(0, Math.min(1, (p - .3) / .6));
      if (p < 1) { requestAnimationFrame(step); return; }
      // wait for the live page to be on screen (or give up after a moment) before switching to it for real
      const waitStart = now;
      const hold = t => { if (ready || t - waitStart > 1500) setTimeout(goNow, ready && live ? 120 : 40); else requestAnimationFrame(hold); };
      requestAnimationFrame(hold);
    };
    requestAnimationFrame(step);
    setTimeout(goNow, 3200);   // never strand the user if something stalls
  }
  // coming back via the back button restores the page from cache: clear the launch layer
  addEventListener('pageshow', e => {
    if (!e.persisted) return;
    launching = false;
    document.querySelectorAll('.launch, .launch-bg').forEach(n => n.remove());
    document.querySelectorAll('.sleeve .face, #rows a').forEach(n => n.style.visibility = '');
  });

  // click: side cover → bring to front; front cover → open
  sleevesEl.addEventListener('click', e => {
    const s = e.target.closest('.sleeve'); if (!s) return;
    if (scene.dataset.justDragged) { e.preventDefault(); return; }
    const n = +s.dataset.n;
    if (n !== Math.round(pos)) { e.preventDefault(); go(n); return; }
    if (!plainClick(e)) return;
    e.preventDefault();
    const img = s.querySelector('img');
    launch(s.href, s.querySelector('.face'), img && (img.currentSrc || img.src), !!s.dataset.live);
  });

  /* ── index view ────────────────────────── */
  const q = $('q'), rowsEl = $('rows'), peek = $('peek');
  function renderIndex() {
    const term = q.value.trim().toLowerCase();
    const rows = list.filter(i => !term || [i.title, i.desc, i.type, ...i.tags].join(' ').toLowerCase().includes(term));
    $('indexTitle').innerHTML = `${active === '전체' ? '모든 아티팩트' : esc(active)} <em class="mono">${String(rows.length).padStart(2, '0')}</em>`;
    rowsEl.innerHTML = rows.length ? rows.map((i, n) => `
      <li><a href="${esc(i.href)}" data-thumb="${esc(i._preview || i.thumb)}"${/스크롤형/.test(i.title) ? ' data-live="1"' : ''}>
        <span class="n mono">${String(n + 1).padStart(2, '0')}</span>
        <span class="ti">${esc(i.title)}${isNew(i.date) ? '<span class="new">NEW</span>' : ''}</span>
        <span class="de">${esc(i.desc)}</span>
        <span class="ty">${esc(i.type)}</span>
        <span class="dt mono">${i.date}</span>
      </a><div class="admin-only row-actions">
        <button type="button" class="pill" data-act="edit" data-href="${esc(i.href)}">수정</button>
        <button type="button" class="pill danger" data-act="delete" data-href="${esc(i.href)}">삭제</button>
      </div></li>`).join('') : '<li class="empty">검색 결과가 없습니다.</li>';
  }
  q.addEventListener('input', renderIndex);

  // floating thumbnail that follows the pointer over a row
  let px = 0, py = 0, pr = 0;
  rowsEl.addEventListener('pointerover', e => {
    const a = e.target.closest('a'); if (!a || e.pointerType !== 'mouse') return;
    peek.firstElementChild.src = a.dataset.thumb; peek.classList.add('show');
  });
  rowsEl.addEventListener('pointerleave', () => peek.classList.remove('show'));
  rowsEl.addEventListener('click', e => {
    const a = e.target.closest('a[data-thumb]'); if (!a || !plainClick(e)) return;
    e.preventDefault();
    const from = peek.classList.contains('show') && peek.offsetWidth ? peek : a;
    launch(a.href, from, a.dataset.thumb, !!a.dataset.live);
  });
  rowsEl.addEventListener('pointermove', e => {
    px = e.clientX; py = e.clientY;
    if (!pr) pr = requestAnimationFrame(() => {
      pr = 0;
      const w = 320, h = 180, x = px + 24 + w > innerWidth ? px - w - 24 : px + 24;
      peek.style.left = x + 'px'; peek.style.top = Math.min(innerHeight - h - 12, Math.max(12, py - h / 2)) + 'px';
    });
  });

  /* ── view switching ─────────────────────── */
  function setView(v, focusSearch) {
    view = v;
    $('stage').hidden = v !== 'stage'; $('index').hidden = v !== 'index';
    $('vStage').setAttribute('aria-pressed', v === 'stage'); $('vIndex').setAttribute('aria-pressed', v === 'index');
    document.body.classList.toggle('stage-mode', v === 'stage');
    peek.classList.remove('show');
    if (v === 'stage') { shown = -1; fitCovers(); layout(); } else { scrollTo(0, 0); if (focusSearch) q.focus(); }
    try { localStorage.setItem('archive-view', v); } catch (_) {}
  }
  $('vStage').onclick = () => setView('stage');
  $('vIndex').onclick = () => setView('index');

  addEventListener('keydown', e => {
    if (e.target === q) { if (e.key === 'Escape') { q.value = ''; renderIndex(); q.blur(); } return; }
    if (e.target.closest('input, textarea, select, dialog')) return;
    if (e.key === '/') { e.preventDefault(); setView('index', true); return; }
    if (view !== 'stage' || e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.key === 'ArrowRight' || e.key === 'ArrowDown') { e.preventDefault(); go(target + 1); }
    else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') { e.preventDefault(); go(target - 1); }
    else if (e.key === 'Home') { e.preventDefault(); go(0); }
    else if (e.key === 'End') { e.preventDefault(); go(list.length - 1); }
    else if (e.key === 'Enter' && !e.target.closest('a,button')) { const s = sleevesEl.children[Math.round(pos)]; if (s) { const img = s.querySelector('img'); launch(s.href, s.querySelector('.face'), img && (img.currentSrc || img.src), !!s.dataset.live); } }
  });
  // fit the front cover to the space between the title and the caption
  function fitCovers() {
    const w = scene.clientWidth, h = scene.clientHeight;
    if (!w || !h) return;
    const narrow = w < 620;
    const cw = Math.max(220, Math.min(940, w * (narrow ? .86 : .62), h * .9 * 16 / 9));
    $('stage').style.setProperty('--cw', Math.round(cw) + 'px');
  }
  addEventListener('resize', () => { if (view === 'stage') { fitCovers(); layout(); } });

  /* ── theme ─────────────────────────────── */
  const root = document.documentElement;
  try { const t = localStorage.getItem('archive-theme'); if (t) root.dataset.theme = t; } catch (_) {}
  $('themeBtn').onclick = () => {
    const dark = root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
    root.dataset.theme = dark ? 'light' : 'dark';
    try { localStorage.setItem('archive-theme', root.dataset.theme); } catch (_) {}
  };

  /* ── season (spring → summer → autumn → winter); bg.js reads data-season ── */
  const SEASONS = [
    ['spring', '봄', '<circle cx="8" cy="4.7" r="2.2"/><circle cx="11.1" cy="7" r="2.2"/><circle cx="9.9" cy="10.6" r="2.2"/><circle cx="6.1" cy="10.6" r="2.2"/><circle cx="4.9" cy="7" r="2.2"/><circle cx="8" cy="8" r="1.1" fill="currentColor" stroke="none"/>'],
    ['summer', '여름', '<circle cx="8" cy="8" r="2.9"/><path d="M8 1.6v1.6M8 12.8v1.6M1.6 8h1.6M12.8 8h1.6M3.5 3.5l1.1 1.1M11.4 11.4l1.1 1.1M3.5 12.5l1.1-1.1M11.4 4.6l1.1-1.1"/>'],
    ['autumn', '가을', '<path d="M3.2 12.8C2.6 7.4 6.4 3 13.2 2.8c.3 6.6-4 10.6-10 10z"/><path d="M2.4 13.6l7.4-7.4M6.2 9.8V7.4M7.9 8.1l2.3.1"/>'],
    ['winter', '겨울', '<path d="M8 1.6v12.8M2.5 4.8l11 6.4M2.5 11.2l11-6.4M6.5 2.9L8 4.2l1.5-1.3M6.5 13.1L8 11.8l1.5 1.3M2.9 7.1l1.9.5-.5 1.9M13.1 7.1l-1.9.5.5 1.9" />'],
  ];
  const autoSeason = () => ['winter', 'winter', 'spring', 'spring', 'spring', 'summer', 'summer', 'summer', 'autumn', 'autumn', 'autumn', 'winter'][new Date().getMonth()];
  const applySeason = (key) => {
    const k = SEASONS.find(s => s[0] === key) ? key : autoSeason();
    const [, name, icon] = SEASONS.find(s => s[0] === k);
    const next = SEASONS[(SEASONS.findIndex(s => s[0] === k) + 1) % 4][1];
    root.dataset.season = k;
    const b = $('seasonBtn');
    b.querySelector('svg').innerHTML = icon;
    b.title = `계절: ${name} · 눌러서 ${next}(으)로`;
    b.setAttribute('aria-label', `계절 전환, 현재 ${name}`);
  };
  {
    let saved = null;
    try { saved = new URLSearchParams(location.search).get('season') || localStorage.getItem('archive-season'); } catch (_) {}
    applySeason(saved);
  }
  $('seasonBtn').onclick = () => {
    const i = SEASONS.findIndex(s => s[0] === root.dataset.season);
    const k = SEASONS[(i + 1) % 4][0];
    applySeason(k);
    try { localStorage.setItem('archive-season', k); } catch (_) {}
    const b = $('seasonBtn'); b.classList.remove('spin'); void b.offsetWidth; b.classList.add('spin');
  };

  /* ── public hooks for admin.js ─────────── */
  window.Archive = {
    get items() { return all; },
    get current() { return list[clamp(Math.round(pos))]; },
    setItems, setView, esc,
  };
  function loadAdmin() {
    if (window.ArchiveAdmin) return window.ArchiveAdmin.open();
    const sc = document.createElement('script'); sc.src = 'admin.js'; document.body.appendChild(sc);
  }
  $('adminLink').onclick = e => { e.preventDefault(); loadAdmin(); };
  $('adminBtn').onclick = loadAdmin;
  $('submitBtn').onclick = () => {
    if (window.ArchiveSubmit) return window.ArchiveSubmit.open();
    const sc = document.createElement('script'); sc.src = 'submit.js'; document.body.appendChild(sc);
  };

  /* ── PWA: offline cache + install button ─ */
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
    addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  }
  let installEvt = null;
  addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; $('installBtn').hidden = false; });
  addEventListener('appinstalled', () => { installEvt = null; $('installBtn').hidden = true; });
  $('installBtn').onclick = async () => {
    if (!installEvt) return;
    installEvt.prompt();
    try { await installEvt.userChoice; } catch (_) {}
    installEvt = null; $('installBtn').hidden = true;
  };

  /* ── boot ──────────────────────────────── */
  fitCovers(); renderTabs(); buildStage(); renderIndex();
  if (document.fonts) document.fonts.ready.then(() => { fitCovers(); layout(); });
  try { if (/[?&#]admin\b/.test(location.search + location.hash) || localStorage.getItem('archive-gh-token') || sessionStorage.getItem('archive-gh-token')) loadAdmin(); } catch (_) {}
  try { if (localStorage.getItem('archive-view') === 'index') setView('index'); } catch (_) {}

  // intro: a thin bar fills while the front covers load, then the stage fades in
  (function intro() {
    const loader = $('loader'), bar = $('loadbar');
    const imgs = [...sleevesEl.querySelectorAll('img')].slice(0, 5);
    if (reduced || !imgs.length) { loader.classList.add('done'); return; }
    let done = 0, fin = false; const finish = () => { if (fin) return; fin = true; loader.classList.add('done'); kick(); };
    const step = () => { done++; bar.style.width = Math.round(done / imgs.length * 100) + '%'; if (done >= imgs.length) setTimeout(finish, 280); };
    imgs.forEach(img => img.complete ? step() : (img.addEventListener('load', step, { once: true }), img.addEventListener('error', step, { once: true })));
    setTimeout(finish, 1800);
    // covers fan out from the stack once the loader is gone
    pos = -3; target = 0; layout();
  })();
</script>
</body>
</html>
